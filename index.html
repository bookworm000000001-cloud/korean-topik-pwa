<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOPIK I">
<meta name="theme-color" content="#FFF8F3">
<meta name="description" content="Learn Korean at TOPIK I level — Hangul, vocab, grammar, reading, listening, mock tests.">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='38' fill='%23E89B9B'/><text x='90' y='118' font-family='-apple-system,sans-serif' font-size='100' font-weight='800' text-anchor='middle' fill='white'>가</text></svg>">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='38' fill='%23E89B9B'/><text x='90' y='118' font-family='-apple-system,sans-serif' font-size='100' font-weight='800' text-anchor='middle' fill='white'>가</text></svg>">
<title>TOPIK I · Korean</title>
<style>
:root{
  --cream:#FFF8F3;
  --paper:#FFFFFF;
  --ink:#2B2A2A;
  --ink-soft:#6B6B6B;
  --line:#EFE6DD;
  --pink:#F4C6C6;
  --pink-deep:#E89B9B;
  --blue:#C9D8F0;
  --blue-deep:#8FA8E0;
  --green:#C9E4D2;
  --yellow:#F6E4B8;
  --accent:#E89B9B;
  --accent-soft:#FCEAEA;
  --shadow:0 1px 3px rgba(0,0,0,0.04), 0 6px 24px rgba(232,155,155,0.08);
  --radius:18px;
  --radius-sm:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  background:linear-gradient(180deg,#F5EFE9 0%, #FFF8F3 100%);
  color:var(--ink);
  font-size:16px;line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-top);
  padding-bottom:calc(96px + var(--safe-bottom));
  overscroll-behavior-y:none;
}
:root{--app-max:480px}
.app{
  max-width:var(--app-max);
  margin:0 auto;
  padding:0 16px;
  min-height:100vh;
}
/* Top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px 10px;
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(255,248,243,0.95),rgba(255,248,243,0.7) 70%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0}
.topbar .sub{font-size:11px;color:var(--ink-soft);font-weight:500}
.streak-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--accent-soft);color:var(--pink-deep);
  padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;
}
.streak-pill svg{width:14px;height:14px}

/* Cards */
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.card-tight{padding:14px}
.section-title{
  font-size:13px;font-weight:700;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:0.08em;
  margin:18px 4px 10px;
}
.h-card{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin:14px 2px 8px}

/* Home dashboard */
.greet{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin:6px 0 2px}
.greet-sub{color:var(--ink-soft);font-size:14px;margin-bottom:14px}
.goal-bar{
  height:8px;background:#F0E8E0;border-radius:999px;overflow:hidden;margin:10px 0 6px;
}
.goal-fill{
  height:100%;background:linear-gradient(90deg,var(--pink-deep),var(--blue-deep));
  border-radius:999px;transition:width .4s ease;
}
.goal-text{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 8px;text-align:center}
.stat .num{font-size:22px;font-weight:800;letter-spacing:-0.02em}
.stat .lbl{font-size:10px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-top:2px}

/* Module grid (home) */
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.module{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 14px;text-align:left;
  box-shadow:var(--shadow);
  cursor:pointer;border:none;width:100%;
  font-family:inherit;color:inherit;
  transition:transform .12s;
}
.module:active{transform:scale(0.97)}
.module .icon{
  width:42px;height:42px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:10px;
}
.module .name{font-size:15px;font-weight:700;letter-spacing:-0.01em}
.module .desc{font-size:11px;color:var(--ink-soft);margin-top:2px}
.icon-hangul{background:var(--accent-soft);color:var(--pink-deep)}
.icon-vocab{background:#EAF1FC;color:var(--blue-deep)}
.icon-grammar{background:#E9F5EF;color:#5BA67A}
.icon-reading{background:#FBF0DC;color:#C68A1F}
.icon-listening{background:#EFEAF5;color:#8E7BB8}
.icon-mock{background:#FCEAEA;color:#C26666}

/* Bottom tab bar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  max-width:var(--app-max);margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 4px calc(8px + var(--safe-bottom));
}
.tab{
  background:none;border:none;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-soft);font-size:10px;font-weight:600;
  padding:4px 0;
}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--pink-deep)}
.tab:active{opacity:0.6}

/* Buttons */
.btn{
  font-family:inherit;border:none;border-radius:14px;
  padding:14px 18px;font-size:15px;font-weight:700;
  cursor:pointer;transition:transform .12s;width:100%;
}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--ink);color:#fff}
.btn-accent{background:var(--pink-deep);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-soft{background:var(--accent-soft);color:var(--pink-deep)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* Hangul grid */
.hg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
.hg-cell{
  background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;
  transition:transform .1s;
}
.hg-cell:active{transform:scale(0.94)}
.hg-cell .letter{font-size:26px;font-weight:700;color:var(--ink)}
.hg-cell .rom{font-size:10px;color:var(--ink-soft);margin-top:2px}
.hg-cell .nm{font-size:9px;color:var(--pink-deep);font-weight:600;margin-top:1px}

.chip-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;background:var(--paper);border:1px solid var(--line);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  cursor:pointer;color:var(--ink-soft);white-space:nowrap;
}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Modal / detail sheet */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.3);
  z-index:200;display:none;align-items:flex-end;justify-content:center;
}
.sheet-backdrop.show{display:flex}
.sheet{
  background:var(--paper);
  width:100%;max-width:var(--app-max);
  border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + var(--safe-bottom));
  max-height:88vh;overflow-y:auto;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:999px;margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-0.02em}
.sheet .big-letter{font-size:72px;font-weight:800;text-align:center;margin:18px 0 6px;letter-spacing:-0.04em}
.sheet .big-rom{text-align:center;font-size:16px;color:var(--ink-soft);margin-bottom:6px}
.sheet .meta-row{text-align:center;font-size:13px;color:var(--pink-deep);font-weight:600;margin-bottom:14px}

/* Flashcard */
.flashcard{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:32px 20px;text-align:center;box-shadow:var(--shadow);
  min-height:200px;display:flex;flex-direction:column;justify-content:center;
  cursor:pointer;transition:transform .15s;
}
.flashcard:active{transform:scale(0.98)}
.flashcard .ko{font-size:42px;font-weight:800;letter-spacing:-0.03em;color:var(--ink)}
.flashcard .rom{font-size:14px;color:var(--ink-soft);margin-top:6px;font-style:italic}
.flashcard .en{font-size:20px;font-weight:700;margin-top:14px;color:var(--pink-deep)}
.flashcard .hint{font-size:11px;color:var(--ink-soft);margin-top:18px}
.flashcard .tap-to-flip{position:absolute;top:14px;right:14px;font-size:10px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.06em}

/* Quiz */
.quiz-q{font-size:17px;font-weight:700;margin:4px 0 14px}
.quiz-choices{display:flex;flex-direction:column;gap:10px}
.choice{
  background:var(--paper);border:2px solid var(--line);border-radius:14px;
  padding:14px 16px;font-size:15px;font-weight:600;cursor:pointer;text-align:left;
  font-family:inherit;color:var(--ink);transition:all .15s;
}
.choice:active{transform:scale(0.98)}
.choice.correct{border-color:#5BA67A;background:#E9F5EF}
.choice.wrong{border-color:#C26666;background:#FCEAEA}
.choice.disabled{pointer-events:none}

.progress{height:6px;background:#F0E8E0;border-radius:999px;overflow:hidden;margin:10px 0 16px}
.progress-fill{height:100%;background:var(--pink-deep);border-radius:999px;transition:width .3s}

/* Reading / listening player */
.player{
  background:linear-gradient(135deg,var(--accent-soft),#EAF1FC);
  border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:14px;
}
.player .play-btn{
  width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;
  border:none;font-size:26px;cursor:pointer;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  transition:transform .12s;
}
.player .play-btn:active{transform:scale(0.94)}
.player .speed-row{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.player .speed-row button{
  background:rgba(255,255,255,0.6);border:none;border-radius:999px;
  padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink-soft);
  font-family:inherit;
}
.player .speed-row button.active{background:var(--ink);color:#fff}
.transcript{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 16px;font-size:15px;line-height:1.7;white-space:pre-line;
  margin-bottom:14px;
}
.transcript .speaker{color:var(--pink-deep);font-weight:700}

/* Mock test */
.mock-section{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin:18px 0 6px}
.score-card{
  background:linear-gradient(135deg,var(--accent-soft),#EAF1FC);
  border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:14px;
}
.score-card .big{font-size:48px;font-weight:800;letter-spacing:-0.03em;color:var(--pink-deep)}
.score-card .lbl{font-size:13px;color:var(--ink-soft);font-weight:600}
.score-card .grade{display:inline-block;background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;margin-top:10px}

/* Settings */
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:none}
.setting-row .lbl{font-size:15px;font-weight:600}
.setting-row .desc{font-size:12px;color:var(--ink-soft)}
.switch{position:relative;width:48px;height:28px;background:#E0D8CF;border-radius:999px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--pink-deep)}
.switch .dot{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
.switch.on .dot{transform:translateX(20px)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;
  font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* Hide */
.hidden{display:none!important}

/* Korean text font (system fallback) */
.ko{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

/* List */
.list-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;
}
.list-item:last-child{border-bottom:none}
.list-item .title{font-size:15px;font-weight:600}
.list-item .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.list-item .chev{color:var(--ink-soft);font-size:18px}
.list-item:active{background:rgba(0,0,0,0.02)}

.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:14px}

.kbd-tag{display:inline-block;background:var(--accent-soft);color:var(--pink-deep);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-right:4px}
.grammar-pattern{background:#FBF0DC;color:#8B6914;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;display:inline-block;margin:6px 0}
.grammar-ex{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.grammar-ex .ko{font-weight:700;font-size:15px}
.grammar-ex .tr{color:var(--ink-soft);font-size:13px;margin-top:3px}

.hint-pill{display:inline-block;background:#EAF1FC;color:var(--blue-deep);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== DATA =====

ttle","cat":"Adjectives"},{"word":"예쁘다","roman":"yeppeuda","en":"pretty","cat":"Adjectives"},{"word":"빠르다","roman":"ppareuda","en":"fast","cat":"Adjectives"},{"word":"느리다","roman":"neurida","en":"slow","cat":"Adjectives"},{"word":"재미있다","roman":"jaemiitda","en":"fun / interesting","cat":"Adjectives"},{"word":"친구","roman":"chingu","en":"friend","cat":"Daily"},{"word":"선생님","roman":"seonsaengnim","en":"teacher","cat":"Daily"},{"word":"학생","roman":"haksaeng","en":"student","cat":"Daily"},{"word":"이름","roman":"ireum","en":"name","cat":"Daily"},{"word":"나라","roman":"nara","en":"country","cat":"Daily"},{"word":"돈","roman":"don","en":"money","cat":"Daily"},{"word":"시간","roman":"sigan","en":"time","cat":"Daily"},{"word":"날씨","roman":"nalssi","en":"weather","cat":"Daily"},{"word":"방학","roman":"banghak","en":"school break","cat":"Daily"},{"word":"여행","roman":"yeohaeng","en":"trip / travel","cat":"Daily"},{"word":"선물","roman":"seonmul","en":"gift","cat":"Daily"},{"word":"사진","roman":"sajin","en":"photo","cat":"Daily"}],"GRAMMAR":[{"id":1,"point":"은/는 (topic)","pattern":"Noun + 은/는","meaning":"Marks the topic (as for ~)","ex":"저는 학생이에요. (As for me, I am a student.)","rule":"은 after consonant-final, 는 after vowel-final"},{"id":2,"point":"이/가 (subject)","pattern":"Noun + 이/가","meaning":"Marks the subject of the clause","ex":"비가 와요. (Rain is falling.)","rule":"이 after consonant-final, 가 after vowel-final"},{"id":3,"point":"을/를 (object)","pattern":"Noun + 을/를","meaning":"Marks the direct object","ex":"밥을 먹어요. (I eat a meal.)","rule":"을 after consonant-final, 를 after vowel-final"},{"id":4,"point":"의 (possessive)","pattern":"Noun + 의","meaning":"Possession (of)","ex":"나의 책 (my book)","rule":"Often shortened to just ㅖ (e.g. 내)"},{"id":5,"point":"에 (location/time)","pattern":"Noun + 에","meaning":"At/in/on (place or time)","ex":"학교에 있어요. (I am at school.)","rule":"Also marks destination of 가다/오다"},{"id":6,"point":"에서 (origin)","pattern":"Place + 에서","meaning":"From / doing at a place","ex":"도서관에서 공부해요. (I study at the library.)","rule":"에 + 서 = at this place"},{"id":7,"point":"으로/로 (means/dir.)","pattern":"Noun + 으로/로","meaning":"By means of / toward","ex":"버스로 가요. (I go by bus.)","rule":"으로 after consonant (except ㄹ), 로 after vowel or ㄹ"},{"id":8,"point":"하고 / 과/와 (and/with)","pattern":"N + 하고 / 과/와","meaning":"And / with (nouns)","ex":"사과하고 바나나 (apple and banana)","rule":"과 after consonant-final, 와 after vowel-final"},{"id":9,"point":"이에요/예요 (is)","pattern":"Noun + 이에요/예요","meaning":"Copula \"is\" (polite)","ex":"물이에요. (It is water.) / 사과예요. (It is an apple.)","rule":"이에요 after consonant, 예요 after vowel"},{"id":10,"point":"아요/어요 (polite)","pattern":"Verb/Adj stem + 아요/어요","meaning":"Polite present/future","ex":"가다 → 가요 (go) / 먹다 → 먹어요 (eat)","rule":"아요 if stem ends in ㅏ/ㅗ, else 어요; 하 → 해요"},{"id":11,"point":"습니다/ㅂ니다 (formal)","pattern":"Stem + 습니다/ㅂ니다","meaning":"Formal polite (declarative)","ex":"갑니다. (I go.) / 있습니다. (There is.)","rule":"습니다 after consonant, ㅂ니다 after vowel"},{"id":12,"point":"지 않다 (negation)","pattern":"Stem + 지 않다","meaning":"Do not / is not (verb negation)","ex":"먹지 않아요. (I do not eat.)","rule":"Alternative: 안 + verb (안 먹어요)"},{"id":13,"point":"안 (negation)","pattern":"안 + Verb/Adj","meaning":"Do not (short negation)","ex":"안 가요. (I do not go.)","rule":"Only with 하다 verbs: 안 공부해요, NOT 공부안해요"},{"id":14,"point":"못 (cannot)","pattern":"못 + Verb","meaning":"Cannot do (involuntary)","ex":"못 가요. (I cannot go.)","rule":"Different from 안 (deliberate) — 못 implies inability"},{"id":15,"point":"고 싶다 (want to)","pattern":"Stem + 고 싶다","meaning":"Want to do","ex":"가고 싶어요. (I want to go.)","rule":"With 하다 verbs: 공부하고 싶어요"},{"id":16,"point":"을/ㄹ 수 있다 (can)","pattern":"Stem + 을/ㄹ 수 있다","meaning":"Can do","ex":"한국어를 할 수 있어요. (I can speak Korean.)","rule":"ㄹ 수 after vowel/ㄹ, 을 수 after consonant"},{"id":17,"point":"을/ㄹ 수 없다 (cannot)","pattern":"Stem + 을/ㄹ 수 없다","meaning":"Cannot do","ex":"못 갈 수 없어요? — 갈 수 없어요. (I cannot go.)","rule":"Negative of 수 있다"},{"id":18,"point":"아/어야 하다 (must)","pattern":"Stem + 아/어야 하다","meaning":"Must / have to","ex":"공부해야 해요. (I must study.)","rule":"아야 after ㅏ/ㅗ stems, 어야 otherwise"},{"id":19,"point":"아/어도 되다 (may)","pattern":"Stem + 아/어도 되다","meaning":"May / it is ok to","ex":"앉아도 돼요? (May I sit?)","rule":"Permission pattern"},{"id":20,"point":"을/ㄹ 거예요 (future)","pattern":"Stem + 을/ㄹ 거예요","meaning":"Will / be going to","ex":"내일 갈 거예요. (I will go tomorrow.)","rule":"ㄹ 거예요 after vowel/ㄹ, 을 거예요 after consonant"},{"id":21,"point":"았/었- (past)","pattern":"Stem + 았/었어요","meaning":"Past tense","ex":"먹었어요. (I ate.) / 갔어요. (I went.)","rule":"았 after ㅏ/ㅗ stems, 었 otherwise"},{"id":22,"point":"고 (and then)","pattern":"Stem + 고","meaning":"And then (sequence)","ex":"밥 먹고 가요. (I eat and then go.)","rule":"Shows order of actions"},{"id":23,"point":"지만 (but)","pattern":"Clause + 지만","meaning":"But / however","ex":"춥지만 행복해요. (It is cold but I am happy.)","rule":"Attaches to stem"},{"id":24,"point":"어서/아서 (because)","pattern":"Stem + 아서/어서","meaning":"Because / so (reason)","ex":"바빠서 못 가요. (I am busy so I cannot go.)","rule":"Cannot be past tense on its own stem"},{"id":25,"point":"려고 (in order to)","pattern":"Stem + 려고","meaning":"In order to (intention)","ex":"공부하려고 도서관에 가요. (I go to the library to study.)","rule":"Used with action verbs"},{"id":26,"point":"면/으면 (if)","pattern":"Stem + (으)면","meaning":"If / when","ex":"비가 오면 안 가요. (If it rains, I will not go.)","rule":"으면 after consonant-final, 면 after vowel"},{"id":27,"point":"은/는 것 (noun phrase)","pattern":"Stem + 은/는 것","meaning":"Doing ~ (gerund)","ex":"요리하는 것을 좋아해요. (I like cooking.)","rule":"는 것 after verbs, 은 것 after adjectives"},{"id":28,"point":"보다 (comparison)","pattern":"N1 보다 N2","meaning":"N2 more than N1","ex":"사과보다 바나나를 좋아해요. (I like bananas more than apples.)","rule":"Often paired with 더 (more)"},{"id":29,"point":"처럼/같이 (like)","pattern":"Noun + 처럼/같이","meaning":"Like / as ~","ex":"천사처럼 예뻐요. (Pretty like an angel.)","rule": function today(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function bumpStreak(){
  const t = today();
  if(state.lastActive === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  if(state.lastActive === yStr){
    state.streak++;
  } else if(state.lastActive === ''){
    state.streak = 1;
  } else {
    state.streak = 1;
  }
  state.lastActive = t;
  localStorage.setItem('streak', state.streak);
  localStorage.setItem('lastActive', state.lastActive);
}
function addXp(n){
  state.xp += n;
  state.dailyXp += n;
  localStorage.setItem('xp', state.xp);
  localStorage.setItem('dailyXp_'+today(), state.dailyXp);
  bumpStreak();
}

// ===== TTS (Web Speech API) =====
let voices = [];
function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  // pick best korean voice
  state.ttsVoice = voices.find(v=>/ko(-KR|_KR)?/i.test(v.lang)) || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('ko')) || null;
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, opts={}){
  if(!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  if(state.ttsVoice) u.voice = state.ttsVoice;
  u.rate = opts.rate || state.ttsRate;
  u.pitch = opts.pitch || 1;
  window.speechSynthesis.speak(u);
}
function stopSpeak(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}
function playMockListen(idx){
  const text = (window.__mockListen && window.__mockListen[idx]) || '';
  speak(text, { rate: 0.9 });
}

// ===== TOAST =====
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);
}

  bd.classList.add('show');
  bd.onclick = (e)=>{ if(e.target === bd) closeSheet(); };

  document.getElementById('sheetBackdrop').classList.remove('show');

}

const app = document.getElementById('app');
function render(){
  let html = '';
  if(state.view==='home') html = renderHome();
  else if(state.view==='hangul') html = renderHangul();
  else if(state.view==='vocab') html = renderVocab();
  else if(state.view==='grammar') html = renderGrammar();
  else if(state.view==='reading') html = renderReading();
  else if(state.view==='listening') html = renderListening();
  else if(state.view==='mock') html = renderMock();
  else if(state.view==='stats') html = renderStats();
  else if(state.view==='settings') html = renderSettings();
  app.innerHTML = html;
  // re-bind nav clicks
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ state.view = el.dataset.nav; state.subView=null; window.scrollTo(0,0); render(); };
  });
  document.querySelectorAll('[data-back]').forEach(el=>{
    el.onclick = ()=>{ state.view = el.dataset.back; state.subView=null; window.scrollTo(0,0); render(); };
  });
  // post-render hooks per view
  if(state.view==='home') bindHome();
  else if(state.view==='hangul') bindHangul();
  else if(state.view==='vocab') bindVocab();
  else if(state.view==='grammar') bindGrammar();
  else if(state.view==='reading') bindReading();
  else if(state.view==='listening') bindListening();
  else if(state.view==='mock') bindMock();
  else if(state.view==='settings') bindSettings();
  renderTabbar();
}

function startVocabFlash(){
  const items = vocabCat==='All' ? VOCAB : VOCAB.filter(v=>v.cat===vocabCat);
  if(!items.length) return;
  state.flashIdx = 0;
  state.flashFlipped = false;
  showVocabFlash(items);
}
function showVocabFlash(items){
  const v = items[state.flashIdx];
  openSheet(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:12px;font-weight:700;color:var(--ink-soft)">CARD ${state.flashIdx+1} / ${items.length}</div>
      <button class="tab" onclick="closeSheet()" style="padding:4px 8px;color:var(--ink-soft)">✕</button>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(state.flashIdx+1)/items.length*100}%"></div></div>
    <div class="flashcard" id="flashCard" style="position:relative">
      <div class="tap-to-flip">tap to flip</div>
      ${state.flashFlipped ? `
        <div class="en">${v.en}</div>
        <div class="rom" style="margin-top:8px">${v.roman}</div>
      ` : `
        <div class="ko">${v.word}</div>
        <div class="rom">${v.roman}</div>
        <div class="hint">Tap card to reveal meaning</div>
      `}
    </div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-ghost" id="prevCard" ${state.flashIdx===0?'disabled':''}>← Prev</button>
      <button class="btn btn-accent" id="speakCard">▶</button>
      <button class="btn btn-primary" id="nextCard">Next →</button>
    </div>
  `);
  document.getElementById('flashCard').onclick = ()=>{
    state.flashFlipped = !state.flashFlipped;
    showVocabFlash(items);
  };
  document.getElementById('speakCard').onclick = (e)=>{ e.stopPropagation(); speak(v.word); };
  document.getElementById('prevCard').onclick = (e)=>{
    e.stopPropagation();
    if(state.flashIdx>0){ state.flashIdx--; state.flashFlipped=false; showVocabFlash(items); }
  };
  document.getElementById('nextCard').onclick = (e)=>{
    e.stopPropagation();
    if(!state.learnedVocab.includes(v.word)){
      state.learnedVocab.push(v.word);
      localStorage.setItem('learnedVocab', JSON.stringify(state.learnedVocab));
      addXp(3);
    }
    if(state.flashIdx < items.length-1){
      state.flashIdx++; state.flashFlipped=false; showVocabFlash(items);
    } else {
      toast('🎉 Deck done! +XP');
      closeSheet(); render();
    }
  };
}
function startVocabQuiz(){
  const items = vocabCat==='All' ? VOCAB.slice() : VOCAB.filter(v=>v.cat===vocabCat);
  const shuffled = items.sort(()=>Math.random()-0.5).slice(0, Math.min(10, items.length));
  state.quizQuestions = shuffled.map(v=>{
    const wrongs = VOCAB.filter(x=>x.word!==v.word).sort(()=>Math.random()-0.5).slice(0,3);
    const choices = [v, ...wrongs].sort(()=>Math.random()-0.5);
    return { prompt: v.word, promptType:'ko', choices: choices.map(c=>c.en), answer: choices.findIndex(c=>c.word===v.word) };
  });
  state.quizIdx = 0;
  state.quizScore = 0;
  state.quizAnswers = [];
  showVocabQuiz();
}
function showVocabQuiz(){
  if(state.quizIdx >= state.quizQuestions.length){
    const pct = Math.round(state.quizScore/state.quizQuestions.length*100);
    addXp(state.quizScore*4);
    openSheet(`
      <h2>Quiz complete!</h2>
      <div class="score-card" style="margin-top:14px">
        <div class="big">${state.quizScore} / ${state.quizQuestions.length}</div>
        <div class="lbl">Correct answers · +${state.quizScore*4} XP</div>
        <div class="grade">${pct>=80?'Excellent':pct>=60?'Good job':'Keep practicing'}</div>
      </div>
      <button class="btn btn-accent" onclick="closeSheet();render()">Done</button>
    `);
    return;
  }
  const q = state.quizQuestions[state.quizIdx];
  openSheet(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:12px;font-weight:700;color:var(--ink-soft)">Q${state.quizIdx+1} / ${state.quizQuestions.length}</div>
      <button class="tab" onclick="closeSheet()" style="padding:4px 8px;color:var(--ink-soft)">✕</button>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${(state.quizIdx+1)/state.quizQuestions.length*100}%"></div></div>
    <div class="quiz-q" style="text-align:center">
      <div style="font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">What does this word mean?</div>
      <div class="ko" style="font-size:36px;font-weight:800;margin:8px 0">${q.prompt}</div>
      <button class="tab" onclick="speak('${q.prompt}')" style="padding:4px;color:var(--pink-deep);font-size:13px">▶ Hear</button>
    </div>
    <div class="quiz-choices" id="quizChoices">
      ${q.choices.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join('')}
    </div>
  `);
  document.querySelectorAll('#quizChoices .choice').forEach(ch=>{
    ch.onclick = ()=>{
      const i = parseInt(ch.dataset.i);
      document.querySelectorAll('#quizChoices .choice').forEach(c=>c.classList.add('disabled'));
      if(i===q.answer){
        ch.classList.add('correct'); state.quizScore++;
      } else {
        ch.classList.add('wrong');
        document.querySelectorAll('#quizChoices .choice')[q.answer].classList.add('correct');
      }
      setTimeout(()=>{ state.quizIdx++; showVocabQuiz(); }, 900);
    };
  });
}

        const ci = parseInt(ch.dataset.i);
        const q = l.questions[qi];
        const group = qz.querySelectorAll(`[data-q="${qi}"]`);
        group.forEach(c=>c.classList.add('disabled'));
        if(ci===q.answer){ ch.classList.add('correct'); addXp(3); }
        else { ch.classList.add('wrong'); group[q.answer].classList.add('correct'); }
      };
    });
  }, 50);
}

// ----- MOCK TEST -----
function renderMock(){
  if(state.mockResult){
    const r = state.mockResult;
    return `
    ${subHeader('Mock Test · 결과')}
    <div class="score-card">
      <div class="big">${r.total}</div>
      <div class="lbl">out of ${r.max} · ${r.percent}%</div>
      <div class="grade">${r.grade}</div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:8px">BREAKDOWN</div>
      <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Vocab & Grammar</span><strong>${r.vg} / ${MOCK.vocabGrammar.length}</strong></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Reading</span><strong>${r.rd} / ${MOCK.reading.length}</strong></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Listening</span><strong>${r.ls} / ${MOCK.listening.length}</strong></div>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="state.mockResult=null;state.mockAnswers={};state.mockSection=0;state.mockStarted=true;render()">Review</button>
      <button class="btn btn-accent" id="retryMock">Retry test</button>
    </div>
    <div style="height:20px"></div>
    `;
  }
  if(!state.mockStarted){
    return `
    ${subHeader('Mock Test · 시험')}
    <div class="card">
      <div style="font-size:14px;line-height:1.7">This TOPIK I-style mock test has 3 sections: <strong>Vocabulary & Grammar (${MOCK.vocabGrammar.length} Q)</strong>, <strong>Reading (${MOCK.reading.length} Q)</strong>, and <strong>Listening (${MOCK.listening.length} Q)</strong>. Total: <strong>${MOCK.vocabGrammar.length+MOCK.reading.length+MOCK.listening.length} questions</strong>.</div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:8px">HOW IT WORKS</div>
      <div style="font-size:14px;line-height:1.7">Answer each question, then move to the next section. Listening questions use on-device Korean TTS — make sure your sound is on.</div>
    </div>
    <button class="btn btn-accent" id="startMock">Start test →</button>
    <div style="height:20px"></div>
    `;
  }
  const sections = ['vocabGrammar','reading','listening'];
  const sec = sections[state.mockSection];
  const total = MOCK.vocabGrammar.length + MOCK.reading.length + MOCK.listening.length;
  const answered = Object.keys(state.mockAnswers).length;
  const sectionMeta = {
    vocabGrammar: { title: 'Section 1 · Vocabulary & Grammar', data: MOCK.vocabGrammar, type:'plain' },
    reading: { title: 'Section 2 · Reading', data: MOCK.reading, type:'reading' },
    listening: { title: 'Section 3 · Listening', data: MOCK.listening, type:'listening' },
  };
  const meta = sectionMeta[sec];
  return `
  ${subHeader('Mock Test')}
  <div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin:6px 2px 6px">${meta.title}</div>
  <div class="progress"><div class="progress-fill" style="width:${answered/total*100}%"></div></div>
  <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px">${answered} / ${total} answered</div>
  ${meta.data.map((item,i)=>{
    const qid = sec+'_'+i;
    const ans = state.mockAnswers[qid];
    if(meta.type==='plain'){
      return `
      <div class="card card-tight" style="margin-bottom:10px">
        <div style="font-size:14px;font-weight:700;margin-bottom:10px">${i+1}. ${item.q}</div>
        <div class="quiz-choices">
          ${item.choices.map((c,ci)=>`<button class="choice ${ans===ci?'correct':''}" data-qid="${qid}" data-i="${ci}">${c}</button>`).join('')}
        </div>
      </div>`;
    } else if(meta.type==='reading'){
      return `
      <div class="card card-tight" style="margin-bottom:10px">
        <div style="font-size:12px;color:var(--pink-deep);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Q${i+1}</div>
        <div class="ko" style="background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;margin-bottom:8px">${item.text}</div>
        <button class="tab" onclick="speak('${item.text}')" style="padding:4px 0;color:var(--pink-deep);font-size:12px;margin-bottom:8px">▶ Listen</button>
        <div style="font-size:14px;font-weight:600;margin-bottom:8px">${item.q}</div>
        <div class="quiz-choices">
          ${item.choices.map((c,ci)=>`<button class="choice ${ans===ci?'correct':''}" data-qid="${qid}" data-i="${ci}">${c}</button>`).join('')}
        </div>
      </div>`;
    } else {
      // Store the cleaned transcript in a lookup so the inline onclick stays a plain string.
      window.__mockListen = window.__mockListen || [];
      const plain = item.transcript.replace(/^[^:]+: /gm,'').replace(/\n/g,' ');
      const storeIdx = window.__mockListen.push(plain) - 1;
      return `
      <div class="card card-tight" style="margin-bottom:10px">
        <div style="font-size:12px;color:var(--pink-deep);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Q${i+1}</div>
        <div class="player" style="padding:14px;margin-bottom:8px">
          <button class="play-btn" style="width:48px;height:48px;font-size:20px" onclick="playMockListen(${storeIdx})">▶</button>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:6px">Tap to listen</div>
        </div>
        <div style="font-size:14px;font-weight:600;margin-bottom:8px">${item.q}</div>
        <div class="quiz-choices">
          ${item.choices.map((c,ci)=>`<button class="choice ${ans===ci?'correct':''}" data-qid="${qid}" data-i="${ci}">${c}</button>`).join('')}
        </div>
      </div>`;
    }
  }).join('')}
  <button class="btn btn-accent" id="nextSection">${state.mockSection<2?'Next section →':'Finish & see score'}</button>
  <div style="height:20px"></div>
  `;
}
function bindMock(){
  const startBtn = document.getElementById('startMock');
  if(startBtn) startBtn.onclick = ()=>{ state.mockStarted=true; state.mockSection=0; render(); };
  document.querySelectorAll('#app .choice[data-qid]').forEach(ch=>{
    ch.onclick = ()=>{
      const qid = ch.dataset.qid;
      const i = parseInt(ch.dataset.i);
      const prev = state.mockAnswers[qid];
      state.mockAnswers[qid] = i;
      // re-render to reflect selection
      render();
    };
  });
  const nextBtn = document.getElementById('nextSection');
  if(nextBtn) nextBtn.onclick = ()=>{
    if(state.mockSection < 2){ state.mockSection++; render(); window.scrollTo(0,0); }
    else finishMock();
  };
  const retry = document.getElementById('retryMock');
  if(retry) retry.onclick = ()=>{
    state.mockResult=null; state.mockAnswers={}; state.mockSection=0; state.mockStarted=true; render();
  };
}
function finishMock(){
  const ans = state.mockAnswers;
  let vg=0, rd=0, ls=0;
  MOCK.vocabGrammar.forEach((q,i)=>{ if(ans['vocabGrammar_'+i]===q.answer) vg++; });
  MOCK.reading.forEach((q,i)=>{ if(ans['reading_'+i]===q.answer) rd++; });
  MOCK.listening.forEach((q,i)=>{ if(ans['listening_'+i]===q.answer) ls++; });
  const total = vg+rd+ls;
  const max = MOCK.vocabGrammar.length + MOCK.reading.length + MOCK.listening.length;
  const percent = Math.round(total/max*100);
  const grade = percent>=80?'Level 2 ready':percent>=60?'Level 1 ready':'Keep practicing';
  state.mockResult = { total, max, percent, grade, vg, rd, ls };
  addXp(total*5);
  render();
  window.scrollTo(0,0);
}

// ----- STATS -----
function renderStats(){
  const vocabPct = Math.round(state.learnedVocab.length/VOCAB.length*100);
  const gramPct = Math.round(state.learnedGrammar.length/GRAMMAR.length*100);
  return `
  ${subHeader('Progress · 통계')}
  <div class="card">
    <div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px">VOCABULARY</div>
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em">${state.learnedVocab.length} <span style="font-size:14px;color:var(--ink-soft);font-weight:600">/ ${VOCAB.length}</span></div>
    <div class="goal-bar"><div class="goal-fill" style="width:${vocabPct}%"></div></div>
    <div class="goal-text"><span>${vocabPct}% learned</span></div>
  </div>
  <div class="card">
    <div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px">GRAMMAR</div>
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em">${state.learnedGrammar.length} <span style="font-size:14px;color:var(--ink-soft);font-weight:600">/ ${GRAMMAR.length}</span></div>
    <div class="goal-bar"><div class="goal-fill" style="width:${gramPct}%"></div></div>
    <div class="goal-text"><span>${gramPct}% learned</span></div>
  </div>
  <div class="stats-grid">
    <div class="stat"><div class="num">${state.xp}</div><div class="lbl">Total XP</div></div>
    <div class="stat"><div class="num">${state.streak}</div><div class="lbl">Day streak</div></div>
    <div class="stat"><div class="num">${state.dailyXp}</div><div class="lbl">Today XP</div></div>
  </div>
  <div class="section-title">By category</div>
  <div class="card">
    ${Array.from(new Set(VOCAB.map(v=>v.cat))).map(cat=>{
      const total = VOCAB.filter(v=>v.cat===cat).length;
      const learned = VOCAB.filter(v=>v.cat===cat && state.learnedVocab.includes(v.word)).length;
      const pct = Math.round(learned/total*100);
      return `
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px"><span>${cat}</span><span style="color:var(--ink-soft)">${learned}/${total}</span></div>
          <div class="goal-bar"><div class="goal-fill" style="width:${pct}%"></div></div>
        </div>`;
    }).join('')}
  </div>
  <div style="height:20px"></div>
  `;
}

function bindSettings(){
  document.querySelectorAll('[data-rate]').forEach(b=>{
    b.onclick = ()=>{
      state.ttsRate = parseFloat(b.dataset.rate);
      localStorage.setItem('ttsRate', state.ttsRate);
      render();
    };
  });
  document.querySelectorAll('[data-goal]').forEach(b=>{
    b.onclick = ()=>{
      state.dailyGoal = parseInt(b.dataset.goal);
      localStorage.setItem('dailyGoal', state.dailyGoal);
      render();
    };
  });
  const rb = document.getElementById('resetBtn');
  if(rb) rb.onclick = ()=>{
    if(confirm('Reset all progress? This cannot be undone.')){
      localStorage.clear();
      state.xp=0; state.streak=0; state.dailyXp=0; state.learnedVocab=[]; state.learnedGrammar=[]; state.lastActive=''; state.ttsRate=0.9;
      toast('Progress reset');
      render();
    }
  };
}

// ----- TAB BAR -----
function renderTabbar(){
  let tb = document.querySelector('.tabbar');
  if(!tb){
    tb = document.createElement('div');
    tb.className = 'tabbar';
    document.body.appendChild(tb);
  }
  const tabs = [
    { id:'home', label:'Home', icon:IC.home },
    { id:'vocab', label:'Vocab', icon:IC.book },
    { id:'grammar', label:'Grammar', icon:IC.book },
    { id:'stats', label:'Stats', icon:IC.stats },
    { id:'settings', label:'Settings', icon:IC.gear },
  ];
  tb.innerHTML = tabs.map(t=>`
    <button class="tab ${state.view===t.id?'active':''}" data-tab="${t.id}">
      ${t.icon}
      <span>${t.label}</span>
    </button>`).join('');
  tb.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = ()=>{
      state.view = b.dataset.tab;
      state.subView = null;
      window.scrollTo(0,0);
      render();
    };
  });
}
